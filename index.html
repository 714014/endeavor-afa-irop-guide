<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Endeavor AFA IROP Guide</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="app-header">
        <div class="brand">
          <img
            class="brand-logo"
            src="images/afa-logo-placeholder.png.webp"
            alt="AFA"
          />
          <p class="brand-name">Endeavor AFA IROP Guide</p>
        </div>
        <nav class="breadcrumb" id="breadcrumb" aria-label="Progress"></nav>
      </header>

      <main class="app-main" id="app" aria-live="polite"></main>

      <footer class="app-footer">
        <div class="nav-controls">
          <button type="button" class="btn btn-secondary" id="btn-back" disabled>
            Back
          </button>
          <button type="button" class="btn btn-ghost" id="btn-restart">
            Start over
          </button>
        </div>
        <p class="disclaimer">
          Follow Crew Services instructions and company policy if they conflict
          with this guide.
        </p>
      </footer>
    </div>

    <div
      id="lightbox"
      class="lightbox"
      hidden
      role="dialog"
      aria-modal="true"
      aria-label="Enlarged image"
    >
      <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Close">
        ×
      </button>
      <img id="lightbox-image" class="lightbox-image" alt="" />
    </div>

    <script src="flow.js"></script>
    <script src="app.js"></script>
  </body>
</html>
